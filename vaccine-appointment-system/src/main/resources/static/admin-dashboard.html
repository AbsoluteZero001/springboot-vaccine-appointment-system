<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理控制台 - 疫苗预约系统</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .status-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-confirmed {
            background: #f0fdf4;
            color: #16a34a;
        }

        .status-completed {
            background: #eff6ff;
            color: #2563eb;
        }

        .status-cancelled {
            background: #f5f5f5;
            color: #6b7280;
        }

        .admin-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 9px 22px;
            border-radius: 50px;
            border: 2px solid #e2e8f0;
            background: white;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--gray-color);
            transition: var(--transition);
            font-family: inherit;
        }

        .admin-tab:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .admin-tab.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        }

        .appt-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 20px 24px;
            margin-bottom: 14px;
            border: 1px solid #f1f5f9;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .appt-card:hover {
            box-shadow: var(--box-shadow-hover);
        }

        .appt-info {
            flex: 1;
            min-width: 0;
        }

        .appt-info .appt-id {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .appt-info .appt-user {
            font-weight: 700;
            color: var(--dark-color);
            font-size: 1rem;
        }

        .appt-info .appt-vaccine {
            font-size: 0.9rem;
            color: var(--gray-color);
        }

        .appt-info .appt-time {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .appt-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 8px 20px;
            font-size: 0.84rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
            color: white;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            box-shadow: 0 3px 12px rgba(34, 197, 94, 0.25);
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
        }

        .btn-complete {
            background: linear-gradient(135deg, #2563eb, #4cc9f0);
            box-shadow: 0 3px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        .btn-cancel-admin {
            background: linear-gradient(135deg, #dc2626, #f72585);
            box-shadow: 0 3px 12px rgba(220, 38, 38, 0.2);
        }

        .btn-cancel-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.3);
        }

        .records-table-wrapper {
            overflow-x: auto;
        }

        .empty-state-admin {
            text-align: center;
            padding: 48px 20px;
            color: #94a3b8;
        }

        .empty-state-admin .empty-icon {
            font-size: 42px;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state-admin h3 {
            font-size: 1.05rem;
            color: var(--gray-color);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<!-- ============ Header ============ -->
<header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">
            <div class="logo-icon">💉</div>
            <span class="logo-text">疫苗预约系统</span>
        </a>
        <nav class="main-nav">
            <a href="admin-dashboard.html" class="active">预约审核</a>
            <a href="admin-vaccine.html">疫苗管理</a>
            <a href="admin-users.html">用户管理</a>
            <a href="#" onclick="logout()">退出登录</a>
        </nav>
    </div>
</header>

<!-- ============ Main Content ============ -->
<main class="homepage-main">
    <div class="container">
        <div id="alert-container"></div>

        <!-- Dashboard Banner -->
        <div class="dashboard-banner">
            <div>
                <h2 id="welcomeText">管理员控制台</h2>
                <p id="welcomeSubtext">审核预约 · 完成接种 · 生成接种记录</p>
            </div>
            <div class="banner-stats">
                <div class="banner-stat">
                    <h3 id="statPending">0</h3>
                    <p>待审核</p>
                </div>
                <div class="banner-stat">
                    <h3 id="statConfirmed">0</h3>
                    <p>待接种</p>
                </div>
                <div class="banner-stat">
                    <h3 id="statCompleted">0</h3>
                    <p>已完成</p>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="admin-tabs" id="adminTabs">
            <button class="admin-tab active" data-status="0" onclick="switchStatusTab(0, this)">待审核</button>
            <button class="admin-tab" data-status="1" onclick="switchStatusTab(1, this)">已确认 · 待接种</button>
            <button class="admin-tab" data-status="2" onclick="switchStatusTab(2, this)">已完成</button>
            <button class="admin-tab" data-status="3" onclick="switchStatusTab(3, this)">已取消</button>
        </div>

        <!-- Appointment List -->
        <div id="appointmentList"></div>

        <!-- Vaccination Records -->
        <div class="card" style="margin-top: 28px;">
            <h2>接种记录</h2>
            <div class="records-table-wrapper">
                <table id="recordsTable">
                    <thead>
                    <tr>
                        <th>编号</th>
                        <th>用户</th>
                        <th>疫苗名称</th>
                        <th>品牌/规格</th>
                        <th>接种时间</th>
                        <th>状态</th>
                        <th>备注</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<!-- ============ Footer ============ -->
<footer class="footer">
    <div class="container">
        <p>疫苗预约系统 © 2026 | 管理员后台</p>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 8px;">国家免疫规划信息平台 · 审核 · 接种 · 记录</p>
    </div>
</footer>

    <script src="app.js"></script>
    <script>
        const admin = getAdmin();
        if (!admin) {
            window.location.href = 'index.html';
        }

        document.getElementById('welcomeText').textContent =
            '欢迎，' + (admin.username || '管理员') + ' 👋';
        document.getElementById('welcomeSubtext').textContent =
            '审核预约 · 完成接种 · 生成接种记录 · ' + new Date().toLocaleDateString('zh-CN');

        const STATUS = {
            0: {text: '待审核', cls: 'status-pending'},
            1: {text: '已确认', cls: 'status-confirmed'},
            2: {text: '已完成', cls: 'status-completed'},
            3: {text: '已取消', cls: 'status-cancelled'}
        };

        let currentStatus = 0;
        let allAppointments = [];

        // Load all appointments for stats
        async function loadStats() {
            try {
                const data = await apiCall('/appointments');
                allAppointments = data;
                const counts = {0: 0, 1: 0, 2: 0, 3: 0};
                data.forEach(a => {
                    counts[a.status] = (counts[a.status] || 0) + 1;
                });
                document.getElementById('statPending').textContent = counts[0];
                document.getElementById('statConfirmed').textContent = counts[1];
                document.getElementById('statCompleted').textContent = counts[2];
            } catch (e) {
                // Silently fail for stats
            }
        }

        // Load appointments by status
        async function loadAppointments(status) {
            try {
                const data = await apiCall(`/appointments/status/${status}`);
                const container = document.getElementById('appointmentList');

                if (!data.length) {
                    const labels = {0: '待审核的预约', 1: '待接种的预约', 2: '已完成的预约', 3: '已取消的预约'};
                    container.innerHTML = `
                        <div class="empty-state-admin">
                            <span class="empty-icon">📋</span>
                            <h3>暂无${labels[status] || ''}</h3>
                            <p>当前没有${labels[status] || ''}记录</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.map(a => {
                    const st = STATUS[a.status] || {text: '未知', cls: ''};
                    const v = a.vaccine || {};
                    const u = a.user || {};
                    const spec = [v.brand, v.dosage].filter(Boolean).join(' | ') || '—';

                    let actions = '';
                    if (a.status === 0) {
                        actions = `
                            <button class="btn-sm btn-confirm" onclick="confirmAppt(${a.id})">✓ 审核通过</button>
                            <button class="btn-sm btn-cancel-admin" onclick="cancelAppt(${a.id})">✕ 取消</button>
                        `;
                    } else if (a.status === 1) {
                        actions = `
                            <button class="btn-sm btn-complete" onclick="completeAppt(${a.id})">💉 完成接种</button>
                            <button class="btn-sm btn-cancel-admin" onclick="cancelAppt(${a.id})">✕ 取消</button>
                        `;
                    }

                    return `
                        <div class="appt-card">
                            <div class="appt-info">
                                <span class="appt-id">#${a.id}</span>
                                <span class="appt-user">${u.username || '—'}</span>
                                <span class="appt-vaccine"> · ${v.name || '—'}</span>
                                <span class="appt-vaccine"> · ${spec}</span>
                                <div class="appt-time">
                                    🕐 ${new Date(a.appointmentTime).toLocaleString('zh-CN')}
                                    <span class="status-badge ${st.cls}">${st.text}</span>
                                </div>
                            </div>
                            ${actions ? `<div class="appt-actions">${actions}</div>` : ''}
                        </div>
                    `;
                }).join('');
            } catch (e) {
                showAlert('加载预约数据失败', 'error');
            }
        }

        // Load vaccination records
        async function loadRecords() {
            try {
                const data = await apiCall('/vaccination-records/status/1');
                const tbody = document.querySelector('#recordsTable tbody');
                tbody.innerHTML = '';

                if (!data.length) {
                    tbody.innerHTML = `
                        <tr><td colspan="7" style="text-align:center; padding:32px; color:#94a3b8;">
                            📋 暂无接种记录
                        </td></tr>`;
                    return;
                }

                data.forEach(r => {
                    const v = r.vaccine || {};
                    const spec = [v.brand, v.dosage].filter(Boolean).join(' | ') || '—';
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${r.id}</td>
                        <td>${(r.user && r.user.username) || '—'}</td>
                        <td>${v.name || '—'}</td>
                        <td style="font-size:0.85rem;color:var(--gray-color);">${spec}</td>
                        <td>${new Date(r.vaccinationTime).toLocaleString('zh-CN')}</td>
                        <td><span style="padding:2px 10px;border-radius:50px;font-size:0.78rem;font-weight:600;background:#f0fdf4;color:#16a34a;">已接种</span></td>
                        <td style="font-size:0.85rem;">${r.notes || '—'}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (e) {
                // Ignore if no records
            }
        }

        function switchStatusTab(status, btn) {
            currentStatus = status;
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            loadAppointments(status);
        }

        // Confirm appointment
        async function confirmAppt(id) {
            if (!confirm('确认通过此预约审核？')) return;
            try {
                await apiCall(`/appointments/${id}/confirm`, {method: 'POST'});
                showAlert('预约审核已通过，进入待接种状态', 'success');
                loadStats();
                loadAppointments(currentStatus);
                loadRecords();
            } catch (e) {
                showAlert(e.message || '审核失败', 'error');
            }
        }

        // Complete vaccination
        async function completeAppt(id) {
            if (!confirm('确认完成接种？系统将自动生成接种记录。')) return;
            try {
                await apiCall(`/appointments/${id}/complete`, {method: 'POST'});
                showAlert('接种完成！已自动生成接种记录', 'success');
                loadStats();
                loadAppointments(currentStatus);
                loadRecords();
            } catch (e) {
                showAlert(e.message || '完成接种失败', 'error');
            }
        }

        // Cancel appointment (admin)
        async function cancelAppt(id) {
            if (!confirm('确定要取消此预约吗？')) return;
            try {
                await apiCall(`/appointments/${id}/cancel/admin`, {method: 'POST'});
                showAlert('预约已取消', 'success');
                loadStats();
                loadAppointments(currentStatus);
            } catch (e) {
                showAlert(e.message || '取消失败', 'error');
            }
        }

        // Initialize
        loadStats();
        loadAppointments(0);
        loadRecords();
    </script>
</body>
</html>
