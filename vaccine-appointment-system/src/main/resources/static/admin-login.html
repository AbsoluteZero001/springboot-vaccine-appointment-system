<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 疫苗预约系统</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .admin-login-page {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .admin-login-wrapper {
            width: 440px;
            max-width: 100%;
        }

        .admin-login-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .admin-login-card-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #4361ee);
            padding: 32px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .admin-login-card-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 50%, rgba(67, 97, 238, 0.2) 0%, transparent 60%),
            radial-gradient(circle at 70% 30%, rgba(114, 9, 183, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .admin-login-card-header .admin-icon {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 14px;
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 1;
        }

        .admin-login-card-header h2 {
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .admin-login-card-header p {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.85rem;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        .admin-login-card-body {
            padding: 28px;
        }

        .admin-login-card-body .form-group {
            margin-bottom: 20px;
        }

        .admin-login-card-body .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--dark-color);
            font-size: 0.88rem;
        }

        .admin-login-card-body .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: var(--transition);
            background: #f8fafc;
            color: var(--dark-color);
            font-family: inherit;
        }

        .admin-login-card-body .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
            background: white;
        }

        .admin-login-card-body .btn {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
            background: linear-gradient(135deg, #1a1a2e, #4361ee);
            color: white;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            letter-spacing: 1px;
        }

        .admin-login-card-body .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.4);
        }

        .admin-login-card-body .btn:active {
            transform: translateY(0);
        }

        .admin-login-footer-links {
            text-align: center;
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .admin-login-footer-links a {
            color: var(--gray-color);
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .admin-login-footer-links a:hover {
            color: var(--primary-color);
        }

        .admin-login-back {
            text-align: center;
            margin-top: 16px;
        }

        .admin-login-back a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
            padding: 8px 16px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid #e2e8f0;
        }

        .admin-login-back a:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background: white;
        }
    </style>
</head>
<body>

<!-- ============ Header ============ -->
<header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">
            <div class="logo-icon">💉</div>
            <span class="logo-text">疫苗预约系统</span>
        </a>
        <nav class="main-nav">
            <a href="index.html">首页</a>
            <a href="admin-login.html" class="active">管理员后台</a>
        </nav>
    </div>
</header>

<!-- ============ Login Form ============ -->
<main class="admin-login-page">
    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <div class="admin-login-card-header">
                <div class="admin-icon">🔐</div>
                <h2>管理员登录</h2>
                <p>疫苗预约系统 · 后台管理</p>
            </div>
            <div class="admin-login-card-body">
                <div id="alert-container"></div>
                <form id="admin-login-form">
                    <div class="form-group">
                        <label for="admin-username">管理员账号</label>
                        <input type="text" id="admin-username" class="form-control"
                               placeholder="请输入管理员账号" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="admin-password">密码</label>
                        <input type="password" id="admin-password" class="form-control"
                               placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn">管理员登录</button>
                </form>
                <div class="admin-login-footer-links">
                    <a href="index.html">← 返回用户首页</a>
                </div>
            </div>
        </div>

        <div class="admin-login-back">
            <a href="index.html">← 返回疫苗预约系统首页</a>
        </div>
    </div>
</main>

<!-- ============ Footer ============ -->
<footer class="footer">
    <div class="container">
        <p>疫苗预约系统 © 2026 | 管理员后台</p>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 8px;">国家免疫规划信息平台 · 安全 · 便捷 · 可靠</p>
    </div>
</footer>

<script src="app.js"></script>
<script>
    // Auto-redirect if already logged in as admin
    if (getAdmin()) {
        window.location.href = 'admin-dashboard.html';
    }

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('admin-username').value;
        const password = document.getElementById('admin-password').value;
        try {
            const response = await fetch(API_BASE + '/admins/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await response.json();
            if (response.ok) {
                setAuthToken(data.accessToken);
                setAdmin(data.admin);
                showAlert('管理员登录成功！正在跳转...', 'success');
                setTimeout(() => window.location.href = 'admin-dashboard.html', 800);
            } else {
                showAlert(data.error || '用户名或密码错误，请检查输入后重试', 'error');
            }
        } catch (error) {
            showAlert('网络连接失败，请稍后重试', 'error');
        }
    });
</script>
</body>
</html>
