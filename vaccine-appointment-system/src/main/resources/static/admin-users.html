<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 疫苗预约系统</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
<header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">
            <div class="logo-icon">💉</div>
            <span class="logo-text">疫苗预约系统</span>
        </a>
        <nav class="main-nav">
            <a href="admin-dashboard.html">预约审核</a>
            <a href="admin-vaccine.html">疫苗管理</a>
            <a href="admin-users.html" class="active">用户管理</a>
            <a href="#" onclick="logout()">退出登录</a>
        </nav>
        </div>
</header>

    <div class="container">
        <div id="alert-container"></div>
        <div class="card">
            <h2>用户列表</h2>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>邮箱</th>
                        <th>手机号</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Users will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Check authentication
        const admin = getAdmin();
        if (!admin) {
            window.location.href = 'index.html';
        }

        // Load users
        async function loadUsers() {
            try {
                const data = await apiCall('/users');
                const tbody = document.querySelector('#users-table tbody');
                tbody.innerHTML = '';
                data.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${user.phone || '—'}</td>
                        <td>${user.status === 1 ? '正常' : '已停用'}</td>
                        <td>
                            <button class="btn btn-small" onclick="toggleUserStatus(${user.id}, ${user.status})">
                                ${user.status === 1 ? '停用' : '启用'}
                            </button>
                            <button class="btn btn-danger btn-small" onclick="deleteUser(${user.id})">删除</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                showAlert('加载用户列表失败', 'error');
            }
        }

        // Toggle user status
        async function toggleUserStatus(userId, currentStatus) {
            const newStatus = currentStatus === 1 ? 0 : 1;
            try {
                await apiCall(`/users/${userId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: newStatus })
                });
                showAlert('用户状态已更新', 'success');
                loadUsers();
            } catch (error) {
                showAlert(error.message || '更新用户状态失败', 'error');
            }
        }

        // Delete user
        async function deleteUser(userId) {
            if (!confirm('确定要删除此用户吗？其所有预约记录也将被删除。')) return;
            try {
                await apiCall(`/users/${userId}`, {
                    method: 'DELETE'
                });
                showAlert('用户已删除', 'success');
                loadUsers();
            } catch (error) {
                showAlert(error.message || '删除用户失败', 'error');
            }
        }

        // Initialize
        loadUsers();
    </script>

    <footer class="footer">
        <div class="container">
            <p>疫苗预约系统 © 2026 | 管理员后台</p>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 8px;">查看和管理用户账号</p>
        </div>
    </footer>
</body>
</html>
