# =============================================================
# 疫苗预约系统 - Docker Compose 一键编排
# 启动: docker compose up -d
# 停止: docker compose down
# =============================================================

version: '3.8'

services:

  # ==========================================
  # MySQL 8.0 — 关系型数据库
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: vaccine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vaccine_appointment_db}
      MYSQL_USER: ${MYSQL_USER:-vaccine_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vaccine_pass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vaccine-net

  # ==========================================
  # Redis 7 — 缓存 / Session
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: vaccine-redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
        else
          redis-server --appendonly yes;
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaccine-net

  # ==========================================
  # Spring Boot 后端
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vaccine-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vaccine_appointment_db}
      MYSQL_USER: ${MYSQL_USER:-vaccine_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vaccine_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-64-character-string-in-production}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_PORT: ${APP_PORT:-8080}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vaccine-net

  # ==========================================
  # Vue3 前端 — Nginx 静态服务 + 反向代理
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: vaccine-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - vaccine-net

# ==============================================
# 命名卷 — 持久化数据
# ==============================================
volumes:
  mysql-data:
  redis-data:
  uploads:

# ==============================================
# 网络
# ==============================================
networks:
  vaccine-net:
    driver: bridge
