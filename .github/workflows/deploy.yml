name: Deploy Vaccine Appointment System

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vaccine-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # ============================================================
    # CI MySQL
    # 仅用于 GitHub Actions 测试
    # 与生产数据库完全隔离
    # ============================================================
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vaccine_appointment_db
          MYSQL_USER: vaccine_test
          MYSQL_PASSWORD: vaccine_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # ============================================================
    # CI Test Environment
    #
    # 这里只影响 GitHub Actions Runner。
    # 不会覆盖服务器 /etc/vaccine-appointment-system.env
    # ============================================================
    env:
      SPRING_PROFILES_ACTIVE: test

      DB_HOST: 127.0.0.1
      DB_PORT: "3306"

      MYSQL_DATABASE: vaccine_appointment_db
      MYSQL_USER: vaccine_test
      MYSQL_PASSWORD: vaccine_test

      # Hibernate 在 CI 中临时创建表，测试结束删除
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

      # CI 不依赖 Redis
      SPRING_CACHE_TYPE: simple

      # 防止测试阶段尝试访问生产 Redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""

      # 仅用于 CI，绝不能用于生产
      JWT_SECRET: ci-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ

      # CI 上传目录
      UPLOAD_DIR: /tmp/vaccine-appointment-system/uploads

      # CI Spring Boot 测试端口配置
      APP_PORT: "8080"

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================================
      # Java / Maven
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Show Java and Maven versions
        run: |
          java -version
          ./mvnw --version

      - name: Prepare CI upload directory
        run: |
          mkdir -p "$UPLOAD_DIR"
          ls -ld "$UPLOAD_DIR"

      - name: Build and test backend
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress clean verify

      # ==========================================================
      # Node.js / Vue
      # ==========================================================
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_OUT_DIR: dist
        run: |
          set -euo pipefail
          npm run build

      - name: Verify frontend build
        run: |
          set -euo pipefail

          if [ ! -f frontend/dist/index.html ]; then
            echo "ERROR: frontend/dist/index.html not found."
            exit 1
          fi

          echo "===== Frontend build ====="
          find frontend/dist \
            -maxdepth 2 \
            -type f \
            | head -50

      # ==========================================================
      # Prepare Deployment Artifacts
      # ==========================================================
      - name: Prepare deployment artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy-out
          mkdir -p deploy-out

          echo "===== Backend JAR candidates ====="

          find target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            -print

          JAR_FILE="$(find target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*.original' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print \
            -quit)"

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Spring Boot executable JAR not found."
            exit 1
          fi

          if [ ! -s "$JAR_FILE" ]; then
            echo "ERROR: Spring Boot JAR is empty."
            exit 1
          fi

          if [ ! -f frontend/dist/index.html ]; then
            echo "ERROR: frontend/dist/index.html not found."
            exit 1
          fi

          echo
          echo "Using backend JAR:"
          echo "$JAR_FILE"

          cp \
            "$JAR_FILE" \
            deploy-out/vaccine-appointment-system.jar

          tar \
            -C frontend/dist \
            -czf deploy-out/frontend-dist.tar.gz \
            .

          cd deploy-out

          sha256sum \
            vaccine-appointment-system.jar \
            frontend-dist.tar.gz \
            > SHA256SUMS.txt

          echo
          echo "===== Deployment artifacts ====="
          ls -lah

          echo
          echo "===== SHA256 ====="
          cat SHA256SUMS.txt

          echo
          echo "===== Verify SHA256 ====="
          sha256sum -c SHA256SUMS.txt

      # ==========================================================
      # SSH Configuration
      # ==========================================================
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          touch ~/.ssh/known_hosts

          ssh-keyscan \
            -p "$ECS_PORT" \
            -H "$ECS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # ==========================================================
      # SSH Connection Test
      # ==========================================================
      - name: Test SSH connection
        shell: bash
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$ECS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$ECS_USER@$ECS_HOST" \
            "echo 'SSH connection OK'"

      # ==========================================================
      # Clean Remote Incoming Directory
      #
      # 只删除本项目 CI 生成的三个固定发布文件。
      # 不删除其他内容。
      # ==========================================================
      - name: Prepare remote incoming directory
        shell: bash
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$ECS_PORT" \
            -o BatchMode=yes \
            "$ECS_USER@$ECS_HOST" \
            "rm -f \
              /opt/evezero/projects/vaccine-appointment-system/incoming/vaccine-appointment-system.jar \
              /opt/evezero/projects/vaccine-appointment-system/incoming/frontend-dist.tar.gz \
              /opt/evezero/projects/vaccine-appointment-system/incoming/SHA256SUMS.txt"

      # ==========================================================
      # Upload Deployment Artifacts
      # ==========================================================
      - name: Upload deployment artifacts
        shell: bash
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/id_ed25519 \
            -P "$ECS_PORT" \
            deploy-out/vaccine-appointment-system.jar \
            deploy-out/frontend-dist.tar.gz \
            deploy-out/SHA256SUMS.txt \
            "$ECS_USER@$ECS_HOST:/opt/evezero/projects/vaccine-appointment-system/incoming/"

      # ==========================================================
      # Verify Remote Artifacts
      # ==========================================================
      - name: Verify uploaded artifacts
        shell: bash
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$ECS_PORT" \
            -o BatchMode=yes \
            "$ECS_USER@$ECS_HOST" \
            "cd /opt/evezero/projects/vaccine-appointment-system/incoming \
              && ls -lah \
              && sha256sum -c SHA256SUMS.txt"

      # ==========================================================
      # Production Deployment
      #
      # deploy.sh 负责：
      # - 备份旧版本
      # - 安装新版本
      # - systemd restart
      # - /actuator/health
      # - 失败自动回滚
      # ==========================================================
      - name: Deploy production
        shell: bash
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$ECS_PORT" \
            -o BatchMode=yes \
            "$ECS_USER@$ECS_HOST" \
            "sudo /opt/evezero/projects/vaccine-appointment-system/deploy.sh"

      # ==========================================================
      # Final Production Verification
      # ==========================================================
      - name: Verify production deployment
        shell: bash
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$ECS_PORT" \
            -o BatchMode=yes \
            "$ECS_USER@$ECS_HOST" \
            "curl \
              -fsS \
              --connect-timeout 3 \
              --max-time 10 \
              http://127.0.0.1:8081/actuator/health"

          echo
          echo "Production health check passed."